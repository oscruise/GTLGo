# Compila GoTweaks (widget + helper) como paquete MSIX sin firmar y lo publica como pre-release.
# La firma se hace en la Legion con un certificado local (la llave privada nunca sale del equipo).
name: build-legion

on:
  push:
    branches: [ "legion/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      # ADLXCSharpBind.dll y los .cs de ADLXDepends vienen precompilados en el repo, generados
      # de un ADLX local más nuevo que el submódulo. Recompilar el binding los sobrescribe con
      # una versión incompleta, así que se quita de la compilación (solo en el runner).
      - name: Usar el binding ADLX precompilado
        shell: pwsh
        run: |
          (Get-Content XboxGamingBar.sln) | ? { $_ -notmatch 'B9106003-FDC7-4318-A4C7-31C40484CD4E\}\..*\.Build\.0' } | Set-Content XboxGamingBar.sln

      # PresentMon.exe (Intel, MIT) no está versionado; lo usa el helper para FPS/frametimes.
      - name: Agregar PresentMon (release oficial de GameTechDev)
        shell: pwsh
        run: |
          $url = "https://github.com/GameTechDev/PresentMon/releases/download/v2.3.0/PresentMon-2.3.0-x64.exe"
          try {
            Invoke-WebRequest $url -OutFile XboxGamingBarHelper\PresentMon.exe
            Write-Host "PresentMon SHA256: $((Get-FileHash XboxGamingBarHelper\PresentMon.exe).Hash)"
          } catch { Write-Host "::warning::No se pudo descargar PresentMon: $_" }

      - name: Restaurar paquetes NuGet
        run: nuget restore XboxGamingBar.sln

      - name: Compilar paquete (Release x64, sin firma)
        shell: pwsh
        run: |
          msbuild XboxGamingBar.sln /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\\" /p:AppxSymbolPackageEnabled=false `
            /v:minimal /clp:Summary /flp:"logfile=msbuild.log;verbosity=normal" /flp1:"logfile=errores.log;errorsonly"
          $code = $LASTEXITCODE
          Get-Content errores.log -ErrorAction SilentlyContinue | Select-Object -First 10 | % { Write-Host "::error::$_" }
          if ($code -ne 0) { exit $code }

      - name: Agregar signtool (Windows SDK BuildTools, NuGet oficial de Microsoft)
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.4188 -OutputDirectory sdkbt -NonInteractive
          $st = Get-ChildItem sdkbt -Recurse -Filter signtool.exe | ? { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          New-Item -ItemType Directory dist\signtool -Force | Out-Null
          Copy-Item (Join-Path $st.DirectoryName '*') dist\signtool -Recurse
          $bundle = Get-ChildItem out -Recurse -Filter *.msixbundle | Select-Object -First 1
          Copy-Item $bundle.FullName dist\
          $ver = ([xml](Get-Content XboxGamingBarPackage\Package.appxmanifest)).Package.Identity.Version
          "$ver" | Out-File dist\version.txt -Encoding ascii
          "$env:GITHUB_SHA" | Out-File dist\commit.txt -Encoding ascii
          Compress-Archive dist\* "GTLGo_$ver.zip"
          "VER=$ver" >> $env:GITHUB_ENV

      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "legion-$env:VER-$($env:GITHUB_SHA.Substring(0,7))"
          gh release create $tag "GTLGo_$env:VER.zip" --prerelease --target $env:GITHUB_SHA --title "GTLGo $env:VER ($($env:GITHUB_REF_NAME))" --notes "Compilación automática de $env:GITHUB_SHA. Sin firmar: se firma en la Legion."

      - name: Publicar errores (si falla)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "fallo-$($env:GITHUB_SHA.Substring(0,7))-$env:GITHUB_RUN_ATTEMPT"
          $txt = "## Errores`n" + ((Get-Content errores.log -ErrorAction SilentlyContinue | Select-Object -First 60) -join "`n") + "`n`n## Final del log`n" + ((Get-Content msbuild.log -ErrorAction SilentlyContinue | Select-Object -Last 120) -join "`n")
          if ($txt.Length -gt 120000) { $txt = $txt.Substring(0,120000) }
          $txt | Out-File notas.md -Encoding utf8
          gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Fallo de compilacion $tag" --notes-file notas.md
